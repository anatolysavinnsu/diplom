name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  compile:
    name: Compile (warnings as errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.15'
          otp-version: '26'
      - name: Install dependencies
        run: mix deps.get
        working-directory: ./plant_classifier
      - name: Compile
        run: mix compile --no-warnings-as-errors
        working-directory: ./plant_classifier

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: compile
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.15'
          otp-version: '26'
      - name: Install dependencies
        run: mix deps.get
        working-directory: ./plant_classifier
      - name: Create test database
        run: MIX_ENV=test mix ecto.create
        working-directory: ./plant_classifier
      - name: Run migrations
        run: MIX_ENV=test mix ecto.migrate
        working-directory: ./plant_classifier
      - name: Run tests
        run: mix test
        working-directory: ./plant_classifier

  lint:
    name: Lint (Credo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.15'
          otp-version: '26'
      - name: Install dependencies
        run: mix deps.get
        working-directory: ./plant_classifier
      - name: Run Credo
        run: mix credo
        working-directory: ./plant_classifier

  dialyzer:
    name: Dialyzer (static analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.15'
          otp-version: '26'
      - name: Install dependencies
        run: mix deps.get
        working-directory: ./plant_classifier
      - name: Run Dialyzer
        run: mix dialyzer
        working-directory: ./plant_classifier

  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.15'
          otp-version: '26'
      - name: Install dependencies
        run: mix deps.get
        working-directory: ./plant_classifier
      - name: Check formatting
        run: mix format --check-formatted
        working-directory: ./plant_classifier